name: SAIB & Co.
description: >-
  SAIB (Save & Co.) is a Seoul-based Korean intimate cosmetics and wellness
  brand focused on female empowerment, offering premium condoms and solid
  feminine cleansing products made with proprietary, health-conscious
  ingredients such as CranProB. The brand donates 10% of sales revenue to
  campaigns supporting gender equality and women's rights. SAIB sells
  direct-to-consumer through a Cafe24-hosted storefront (saibnco.com); its
  only programmatic surface is the Cafe24 Unified Commerce Platform (UCP)
  storefront, which exposes an OpenID Connect discovery document and an
  OAuth 2.0 / OIDC storefront API for this mall. Surfaced as a portfolio
  company of 500 Global and enriched into the API Evangelist network.
